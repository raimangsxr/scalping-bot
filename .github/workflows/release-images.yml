name: Release Image

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE_NAME: mean-reversion-bot

jobs:
  build-and-push:
    name: Build and push release image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=mean-reversion-bot
          cache-to: type=gha,mode=max,scope=mean-reversion-bot

      - name: Publish release tag artifact
        run: |
          mkdir -p release-info
          echo "${{ github.event.release.tag_name }}" > release-info/tag.txt

      - name: Upload release tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-tag
          path: release-info/tag.txt