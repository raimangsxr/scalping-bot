apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scalping-bot
  namespace: argocd
  annotations:
    scalping-bot.io/release-image-commit: e5c47254f60cb5a62be6be1e4204ade65af054ba
    scalping-bot.io/release-manifest-commit: 8d6b9d50ff6d797bb99a9c0de5412c9cf9c0e9df
spec:
  project: default
  source:
    repoURL: https://github.com/raimangsxr/scalping-bot.git
    targetRevision: 8d6b9d50ff6d797bb99a9c0de5412c9cf9c0e9df
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: scalping-bot
