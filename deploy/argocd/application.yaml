apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scalping-bot
  namespace: argocd
  annotations:
    scalping-bot.io/release-image-commit: 080dd1e71de026002e966fb959a10293101aa183
spec:
  project: default
  source:
    repoURL: https://github.com/raimangsxr/scalping-bot.git
    targetRevision: 476aba47e622980ed25cc194a90452fe4831af67
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: scalping-bot
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
