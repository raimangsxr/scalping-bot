apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scalping-bot
  namespace: argocd
  annotations:
    scalping-bot.io/release-image-commit: e4db243a44280223d5a959bbb93850cd7df7f37e
spec:
  project: default
  source:
    repoURL: https://github.com/raimangsxr/scalping-bot.git
    targetRevision: e4db243a44280223d5a959bbb93850cd7df7f37e
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: scalping-bot
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
