apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scalping-bot
  namespace: argocd
  annotations:
    scalping-bot.io/release-image-commit: 2f4dffcda5a7dfeafe8d7925486ae5ff9c51c152
spec:
  project: default
  source:
    repoURL: https://github.com/raimangsxr/scalping-bot.git
    targetRevision: 2f4dffcda5a7dfeafe8d7925486ae5ff9c51c152
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: scalping-bot
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
