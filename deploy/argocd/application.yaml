apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scalping-bot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/raimangsxr/scalping-bot.git
    targetRevision: 014847915e1bcee6b991358f19f6e78bdcf81037
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: scalping-bot
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
