apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scalping-bot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/raimangsxr/scalping-bot.git
    targetRevision: 5c06fc7924850a85e1b45122ba9818433b4ec593
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: scalping-bot
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
