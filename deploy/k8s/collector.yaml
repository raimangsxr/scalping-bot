apiVersion: apps/v1
kind: Deployment
metadata:
  name: scalping-bot-collector
  namespace: scalping-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scalping-bot
      app.kubernetes.io/component: collector
  template:
    metadata:
      annotations:
        scalping-bot.io/sbom: ghcr.io/raimangsxr/scalping-bot:git-2f4dffcda5a7dfeafe8d7925486ae5ff9c51c152.spdx.json
      labels:
        app.kubernetes.io/name: scalping-bot
        app.kubernetes.io/component: collector
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: collector
          image: ghcr.io/raimangsxr/scalping-bot:git-2f4dffcda5a7dfeafe8d7925486ae5ff9c51c152
          imagePullPolicy: IfNotPresent
          args: ["collect-live", "--storage", "/var/lib/market-data"]
          volumeMounts:
            - name: market-evidence
              mountPath: /var/lib/market-data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: market-evidence
          persistentVolumeClaim:
            claimName: market-evidence
