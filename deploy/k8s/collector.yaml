apiVersion: v1
kind: Service
metadata:
  name: scalping-bot-collector-metrics
  namespace: scalping-bot
spec:
  selector:
    app.kubernetes.io/name: scalping-bot
    app.kubernetes.io/component: collector
  ports:
    - name: metrics
      port: 8001
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scalping-bot-collector
  namespace: scalping-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scalping-bot
      app.kubernetes.io/component: collector
  template:
    metadata:
      annotations:
        scalping-bot.io/sbom: ghcr.io/raimangsxr/scalping-bot:git-4b9784ec07ca21dee7e6126068f9bd47302a9e72.spdx.json
      labels:
        app.kubernetes.io/name: scalping-bot
        app.kubernetes.io/component: collector
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: collector
          image: ghcr.io/raimangsxr/scalping-bot:git-4b9784ec07ca21dee7e6126068f9bd47302a9e72
          imagePullPolicy: IfNotPresent
          args: ["collect-live", "--storage", "/var/lib/market-data"]
          ports:
            - name: metrics
              containerPort: 8001
          readinessProbe:
            exec:
              command: ["python", "-m", "scalping_bot.health", "/var/lib/market-data", "--collector"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["python", "-m", "scalping_bot.health", "/var/lib/market-data", "--collector"]
            periodSeconds: 30
          volumeMounts:
            - name: market-evidence
              mountPath: /var/lib/market-data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: market-evidence
          persistentVolumeClaim:
            claimName: market-evidence
