apiVersion: batch/v1
kind: Job
metadata:
  name: scalping-bot-deployment-gate
  namespace: scalping-bot
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: deployment-gate
          image: ghcr.io/raimangsxr/scalping-bot:git-03fee709d955262d1cdb239199e6969064e5df7c
          args: ["deployment-check"]
          volumeMounts:
            - name: state
              mountPath: /app/state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: state-scalping-bot-0
