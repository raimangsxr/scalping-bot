apiVersion: batch/v1
kind: Job
metadata:
  name: scalping-bot-deployment-gate
  namespace: scalping-bot
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    scalping-bot.io/sbom: ghcr.io/raimangsxr/scalping-bot:git-22967503c849b168e65b5d5b06f8d07b15f4a205.spdx.json
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: deployment-gate
          image: ghcr.io/raimangsxr/scalping-bot:git-22967503c849b168e65b5d5b06f8d07b15f4a205
          args: ["deployment-check"]
          volumeMounts:
            - name: state
              mountPath: /app/state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: state-scalping-bot-0
