apiVersion: v1
kind: Service
metadata:
  name: scalping-bot-metrics
  namespace: scalping-bot
spec:
  selector:
    app.kubernetes.io/name: scalping-bot
    app.kubernetes.io/component: executor
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scalping-bot
  namespace: scalping-bot
  annotations:
    scalping-bot.io/sbom: ghcr.io/raimangsxr/scalping-bot:git-e5c47254f60cb5a62be6be1e4204ade65af054ba.spdx.json
spec:
  serviceName: scalping-bot-metrics
  replicas: 1
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: scalping-bot
      app.kubernetes.io/component: executor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scalping-bot
        app.kubernetes.io/component: executor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: executor
          image: ghcr.io/raimangsxr/scalping-bot:git-e5c47254f60cb5a62be6be1e4204ade65af054ba
          imagePullPolicy: IfNotPresent
          args: ["run-testnet-executor"]
          env:
            - name: SCALPING_BINANCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scalping-bot-secrets
                  key: binance-api-key
            - name: SCALPING_BINANCE_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: scalping-bot-secrets
                  key: binance-api-secret
            - name: SCALPING_TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: scalping-bot-secrets
                  key: telegram-bot-token
            - name: SCALPING_TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: scalping-bot-secrets
                  key: telegram-chat-id
            - name: SCALPING_BACKUP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: scalping-bot-secrets
                  key: backup-encryption-key
            - name: SCALPING_CANDIDATE_MANIFEST
              value: /run/scalping-candidate/manifest.json
            - name: SCALPING_CALIBRATED_HALF_SPREAD_RATE
              valueFrom:
                secretKeyRef:
                  name: scalping-bot-secrets
                  key: calibrated-half-spread-rate
            - name: SCALPING_CALIBRATED_SLIPPAGE_RATE
              valueFrom:
                secretKeyRef:
                  name: scalping-bot-secrets
                  key: calibrated-slippage-rate
            - name: SCALPING_COST_MODEL_SNAPSHOT
              value: /run/scalping-cost/snapshot.json
          ports:
            - name: metrics
              containerPort: 8000
          volumeMounts:
            - name: state
              mountPath: /app/state
            - name: candidate-manifest
              mountPath: /run/scalping-candidate
              readOnly: true
            - name: cost-model
              mountPath: /run/scalping-cost
              readOnly: true
          readinessProbe:
            exec:
              command: ["python", "-m", "scalping_bot.health", "/app/state/scalping-bot.db", "--executor-ready"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["python", "-m", "scalping_bot.health", "/app/state/scalping-bot.db", "--executor-live"]
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: candidate-manifest
          secret:
            secretName: scalping-bot-candidate-manifest
            items:
              - key: manifest.json
                path: manifest.json
        - name: cost-model
          secret:
            secretName: scalping-bot-evidence
            items:
              - key: cost-model-snapshot
                path: snapshot.json
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
