[project]
name = "scalping-bot"
version = "0.1.0"
description = "Deterministic BTCUSDT research and Binance Spot Testnet execution platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3>=1.40.0,<2",
  "cryptography>=50.0.0,<51",
  "duckdb>=1.4.1,<2",
  "httpx>=0.28.1,<0.29",
  "prometheus-client>=0.23.1,<0.24",
  "pyarrow>=23.0.1,<24",
  "pydantic-settings>=2.11.0,<3",
  "structlog>=25.4.0,<26",
  "typer>=0.20.0,<0.21",
  "websockets>=15.0.1,<16",
]

[project.scripts]
scalping-bot = "scalping_bot.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.142.4,<7",
  "mypy>=1.18.2,<2",
  "pip-audit>=2.9.0,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2.0,<2",
  "pytest-cov>=7.0.0,<8",
  "ruff>=0.14.3,<0.15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scalping_bot"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["scalping_bot"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
